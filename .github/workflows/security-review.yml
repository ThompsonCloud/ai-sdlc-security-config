name: Central Security Review (reusable)
on:
  workflow_call: {}
jobs:
  ai-security-review:
    runs-on: [self-hosted, ai-sdlc]
    steps:
      - uses: actions/checkout@v4
      - name: AI 代码评审（open-code-review · 通义千问）
        shell: bash
        run: |
          export HOME=/root
          export PATH=$PATH:/usr/local/bin:/usr/bin
          which ocr || { echo "::error::ocr 未安装"; exit 2; }
          ocr scan --path . 2>&1 | tee ocr-out.txt || true
          echo "## AI 代码评审结果（走通义千问）" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^\[(security|bug)|vuln.py|app.py|Summary' ocr-out.txt >> "$GITHUB_STEP_SUMMARY" || echo "无发现" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: 安全门禁（发现严重/高危即阻断）
        shell: bash
        run: |
          if grep -qE '\[security . (critical|high)\]' ocr-out.txt; then
            n=$(grep -cE '\[security . (critical|high)\]' ocr-out.txt)
            echo "::error::安全门禁 BLOCK：发现 $n 处严重/高危安全问题（含越权/未授权），阻断合并"
            exit 1
          fi
          echo "✅ 安全门禁 PASS：无严重/高危问题"
