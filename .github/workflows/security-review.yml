name: Central Security Review (reusable)

# 中央可复用安全工作流：一条流水线里跑多个独立扫描节点，结果统一 SARIF、汇总到门禁。
# 节点：① ocr AI 代码评审(千问,查越权/注入/密钥) ② Gitleaks(密钥) ③ Trivy(依赖CVE+SBOM,报告态)
#       ④ Semgrep(静态SAST) ⑤ 统一 SARIF 上传 GitHub 安全页 ⑥ 上报 DefectDojo 台账
#       ⑦ 门禁(OPA/Rego 策略即代码，策略取自 policy/gate.rego)
on:
  workflow_call: {}

permissions:
  contents: read
  security-events: write   # 供 SARIF 上传到 Code Scanning

jobs:
  ai-security-review:
    runs-on: [self-hosted, ai-sdlc]
    steps:
      - uses: actions/checkout@v4

      # ① AI 代码评审（越权/注入/硬编码密钥，走千问）→ 输出 SARIF，进安全页/台账/门禁
      - name: 节点① open-code-review AI 代码评审（通义千问）
        shell: bash
        run: |
          export HOME=/root
          export PATH=$PATH:/usr/local/bin:/usr/bin
          which ocr || { echo "::error::ocr 未安装"; exit 2; }
          rm -f ocr-part-*.sarif ocr.sarif .ocr_count
          i=0
          for f in $(git ls-files '*.py'); do
            ocr scan --path "$f" --format sarif -o "ocr-part-$i.sarif" 2>>ocr-stderr.txt || true
            i=$((i+1))
          done
          # 合并各文件 SARIF、仅留 security 类结果 → ocr.sarif（脚本取自中央仓库，版本化）
          curl -sSL -o merge_ocr.py https://raw.githubusercontent.com/ThompsonCloud/ai-sdlc-security-config/main/scripts/merge_ocr_sarif.py
          python3 merge_ocr.py || echo 0 > .ocr_count
          rm -f ocr-part-*.sarif   # 只留合并后的 ocr.sarif，供节点⑤上传
          n=$(cat .ocr_count 2>/dev/null || echo 0)
          {
            echo "## 🤖 节点① AI 代码评审（open-code-review · 千问）：security 类 **${n}** 处（→ SARIF 进安全页/台账/门禁）"
            python3 -c "import json;[print('- ',(x.get('message',{}) or {}).get('text','')[:110]) for x in json.load(open('ocr.sarif'))['runs'][0]['results']]" 2>/dev/null | head -12 || echo "（无 security 发现）"
          } >> "$GITHUB_STEP_SUMMARY"

      # ② Gitleaks 密钥扫描（Docker，无需在 runner 预装）
      - name: 节点② Gitleaks 密钥扫描
        shell: bash
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --no-git --report-format sarif --report-path /repo/gitleaks.sarif --exit-code 0 || true
          gl=$(python3 -c "import json;d=json.load(open('gitleaks.sarif'));print(sum(len(r.get('results',[])) for r in d.get('runs',[])))" 2>/dev/null || echo 0)
          echo "${gl:-0}" > .gl_count
          {
            echo "## 🔑 节点② Gitleaks 密钥扫描：发现 **${gl:-0}** 处硬编码密钥"
            [ "${gl:-0}" -gt 0 ] && python3 -c "import json;[print('- ',x.get('ruleId'),'@',(x.get('locations') or [{}])[0].get('physicalLocation',{}).get('artifactLocation',{}).get('uri','')) for r in json.load(open('gitleaks.sarif')).get('runs',[]) for x in r.get('results',[])]" 2>/dev/null | head -10 || true
          } >> "$GITHUB_STEP_SUMMARY"

      # ③ Trivy 依赖CVE + 配置 + SBOM（报告态，不阻断——依赖 CVE 属分级 triage）
      - name: 节点③ Trivy 依赖/配置扫描 + SBOM（报告态）
        shell: bash
        run: |
          docker run --rm -v "$PWD:/repo" aquasec/trivy:latest \
            fs /repo --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --format sarif --output /repo/trivy.sarif --quiet || true
          docker run --rm -v "$PWD:/repo" aquasec/trivy:latest \
            fs /repo --format cyclonedx --output /repo/sbom.cdx.json --quiet || true
          tv=$(python3 -c "import json;d=json.load(open('trivy.sarif'));print(sum(len(r.get('results',[])) for r in d.get('runs',[])))" 2>/dev/null || echo 0)
          echo "${tv:-0}" > .tv_count
          {
            echo "## 📦 节点③ Trivy 依赖/配置扫描（HIGH/CRITICAL）：**${tv:-0}** 处（报告态，不阻断）；已生成 SBOM \`sbom.cdx.json\`"
            [ "${tv:-0}" -gt 0 ] && python3 -c "import json;[print('- ',(x.get('ruleId') or '')[:60],'—',(x.get('message',{}) or {}).get('text','')[:70]) for r in json.load(open('trivy.sarif')).get('runs',[]) for x in r.get('results',[])]" 2>/dev/null | head -10 || true
          } >> "$GITHUB_STEP_SUMMARY"

      # ④ Semgrep 静态 SAST（开源静态基线，替代 CodeQL）
      - name: 节点④ Semgrep 静态 SAST
        shell: bash
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep:latest \
            semgrep scan --config=p/python --config=p/security-audit --metrics=off --sarif --output=/src/semgrep.sarif /src || true
          sgall=$(python3 -c "import json;d=json.load(open('semgrep.sarif'));print(sum(len(r.get('results',[])) for r in d.get('runs',[])))" 2>/dev/null || echo 0)
          sgerr=$(python3 -c "import json;d=json.load(open('semgrep.sarif'));print(sum(1 for r in d.get('runs',[]) for x in r.get('results',[]) if x.get('level')=='error'))" 2>/dev/null || echo 0)
          echo "${sgerr:-0}" > .sg_count
          {
            echo "## 🔎 节点④ Semgrep 静态扫描：**${sgall:-0}** 处（其中 error 级 **${sgerr:-0}**）"
            [ "${sgall:-0}" -gt 0 ] && python3 -c "import json;[print('- [',x.get('level'),']',(x.get('ruleId') or '')[:55]) for r in json.load(open('semgrep.sarif')).get('runs',[]) for x in r.get('results',[])]" 2>/dev/null | head -10 || true
          } >> "$GITHUB_STEP_SUMMARY"

      # ⑤ 统一 SARIF 上传到 GitHub 安全页（失败不阻断整条流水线）
      - name: 节点⑤ 上传 SARIF 到 Code Scanning
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .

      # ⑥ 上报 DefectDojo 统一漏洞台账——用 reimport-scan（按工具分 test，同一 test 反复覆盖：
      #    再次出现的判为已存在、消失的判为 mitigated，正好贴合 CI 反复跑，不再堆重复）。DD 不可达则跳过。
      - name: 节点⑥ 上报 DefectDojo 台账（reimport，按工具分 test）
        shell: bash
        run: |
          DD_URL="${DEFECTDOJO_URL:-http://localhost:8080}"
          DD_KEY="$(cat /root/.config/ai-sdlc/defectdojo.key 2>/dev/null || echo '')"
          if [ -z "$DD_KEY" ] || ! curl -sf -m 6 "$DD_URL/api/v2/user_profile/" -H "Authorization: Token $DD_KEY" >/dev/null 2>&1; then
            echo "## 📇 节点⑥ DefectDojo：未配置或不可达，跳过（把 API key 放 /root/.config/ai-sdlc/defectdojo.key）" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          imported=""
          reimport_one() {
            [ -f "$1" ] || return 0
            curl -s -m 120 -X POST "$DD_URL/api/v2/reimport-scan/" -H "Authorization: Token $DD_KEY" \
              -F "auto_create_context=true" -F "product_type_name=AI-SDLC" -F "product_name=ai-sdlc-demo-vuln" \
              -F "engagement_name=CI-Security" -F "scan_type=SARIF" -F "test_title=$2" \
              -F "active=true" -F "verified=false" -F "minimum_severity=Info" -F "close_old_findings=true" \
              -F "file=@$1" >/dev/null 2>&1 && imported="$imported $2"
          }
          reimport_one ocr.sarif      "ocr-AI评审"
          reimport_one gitleaks.sarif "gitleaks-密钥"
          reimport_one trivy.sarif    "trivy-依赖"
          reimport_one semgrep.sarif  "semgrep-静态"
          echo "## 📇 节点⑥ DefectDojo 台账（reimport-scan · 按工具分 test）：${imported:- (无)}（product=ai-sdlc-demo-vuln / engagement=CI-Security）" >> "$GITHUB_STEP_SUMMARY"

      # ⑦ 门禁：OPA/Rego 策略即代码（策略取自中央仓库 policy/gate.rego，版本化）
      - name: 节点⑦ 安全门禁（OPA/Rego 策略即代码）
        shell: bash
        run: |
          # ocr 计数改从节点①产出的 .ocr_count 读（= ocr.sarif 里 security 类结果数）；
          # ocr 现在只出 SARIF，安全页/台账/门禁共用一份，不再 grep 文本。
          ocr_high=$(cat .ocr_count 2>/dev/null || echo 0); ocr_high=${ocr_high:-0}
          gl=$(cat .gl_count 2>/dev/null || echo 0); tv=$(cat .tv_count 2>/dev/null || echo 0); sg=$(cat .sg_count 2>/dev/null || echo 0)
          crit="${ASSET_CRITICALITY:-high}"
          printf '{"ocr_high":%s,"gitleaks":%s,"semgrep_error":%s,"trivy":%s,"asset_criticality":"%s"}\n' "${ocr_high:-0}" "${gl:-0}" "${sg:-0}" "${tv:-0}" "$crit" > gate-input.json
          curl -sSL -o gate.rego https://raw.githubusercontent.com/ThompsonCloud/ai-sdlc-security-config/main/policy/gate.rego
          res=$(docker run --rm -i -v "$PWD:/w" -w /w openpolicyagent/opa:latest eval -I -f json -d gate.rego 'data.aisdlc.gate' < gate-input.json 2>/dev/null)
          dec=$(echo "$res" | python3 -c "import sys,json;print(json.load(sys.stdin)['result'][0]['expressions'][0]['value'].get('decision','pass'))" 2>/dev/null || echo pass)
          reasons=$(echo "$res" | python3 -c "import sys,json;print('; '.join(json.load(sys.stdin)['result'][0]['expressions'][0]['value'].get('reasons',[])))" 2>/dev/null || echo '')
          {
            echo "## 🚦 节点⑦ OPA/Rego 门禁（策略即代码）"
            echo "- 策略：\`policy/gate.rego\`（中央仓库·版本化）"
            echo "- 输入：\`$(cat gate-input.json)\`"
            echo "- **决策：${dec}**；原因：${reasons:-无}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$dec" = "block" ]; then
            echo "::error::OPA/Rego 门禁 BLOCK：${reasons}"
            echo "## ⛔ 门禁 BLOCK：${reasons}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ OPA/Rego 门禁：${dec}（${reasons:-无严重/高危}）"
          echo "## ✅ 门禁 ${dec}" >> "$GITHUB_STEP_SUMMARY"
